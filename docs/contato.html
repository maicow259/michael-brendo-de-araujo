<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Meu Portfólio</title>
    <script>if(localStorage.getItem('tema')==='dark')document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div id="menu-container"></div>

    <main class="container-contato">
        <h2>Entre em Contato</h2>
        
        <!-- O Formulário Semântico -->
        <form id="formulario-contato" class="formulario-contato" novalidate>
            
            <!-- Campo Nome -->
            <div class="grupo-campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <!-- Campo E-mail -->
            <div class="grupo-campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="nome@exemplo.com">
            </div>

            <!-- Campo Mensagem -->
            <div class="grupo-campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <!-- Div de Feedback (Invisível por padrão) -->
            <div id="mensagem-feedback" class="mensagem-feedback"></div>

            <!-- Botão Submit -->
            <button type="submit" class="botao-enviar">Enviar mensagem</button>
        </form>
    </main>

    <script src="JS/script.js"></script>
</body>
</html>
