<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- Garante o design responsivo, fazendo o site se ajustar ao tamanho da tela do celular/monitor -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>

    <!-- Lê a preferência do usuário e aplica o tema escuro antes da página carregar, evitando o piscar branco na tela -->
    <script>if(localStorage.getItem('tema')==='dark')document.documentElement.classList.add('dark');</script>

    <!-- Vincula o arquivo CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Div vazia que serve como espaço reservado onde o JavaScript injetará o menu -->
    <div id="menu-container"></div>

    <!-- Carrega e executa a lógica em JavaScript, responsável por puxar o menu e gerenciar a troca de temas -->
    <script src="JS/script.js"></script>
</body>    
</html>
